<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スポーツバインダー</title>
    <style>
        body {
            background-color: #e3f2fd;
            font-family: Arial, sans-serif;
            color: #333;
            padding: 20px;
        }
        h1 {
            color: #007BFF;
        }
        footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>運動中の胸の悩みを解決するスポーツバインダー</h1>
    <p>スポーツバインダーは、運動中に胸の不快感を軽減させるための便利なアイテムです。特に、性的少数者の方々に考慮された設計となっています。</p>
    <form id="binderForm">
        <label for="experience">あなたの経験を共有してください:</label><br>
        <textarea id="experience" rows="4" cols="50" placeholder="ここに書いてください..."></textarea><br>
        <button type="submit">送信</button>
    </form>
    <footer>#KGNINJA</footer>
    <script>
        document.getElementById("binderForm").onsubmit = function(event) {
            event.preventDefault();
            alert("体験を送信しました！");
        };
    </script>
</body>
</html>
