<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お金の相談アプリ</title>
    <style>
        body {
            background-color: #007BFF;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>
    <h1>お金の悩み相談アプリ</h1>
    <p>ここでは、簡単なアドバイスを提供します。必要な情報を入力してください。</p>
    <label for="age">年齢:</label>
    <input type="number" id="age" required>
    <br>
    <label for="income">月収:</label>
    <input type="number" id="income" required>
    <br>
    <button onclick="provideAdvice()">アドバイスを求める</button>
    <p id="advice"></p>
    <script>
        function provideAdvice() {
            const age = document.getElementById('age').value;
            const income = document.getElementById('income').value;
            let advice = '';

            if (age < 30 && income < 300000) {
                advice = '無理をせず、貯金を始めましょう。';
            } else if (age < 30 && income >= 300000) {
                advice = '将来のために投資を検討してみてください。';
            } else if (age >= 30 && income < 500000) {
                advice = '生活費を見直して、貯蓄を増やしてください。';
            } else {
                advice = '資産管理をしっかり行いましょう。';
            }

            document.getElementById('advice').innerText = advice;
        }
    </script>
    <footer>
        <p>#KGNINJA AutoApp</p>
    </footer>
</body>
</html>
