<!DOCTYPE html>\n<html lang="ja">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>暑さ対策相談アプリ</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            background-color: #e0f7fa;\n            color: #007BFF;\n            text-align: center;\n        }\n        button {\n            padding: 10px 20px;\n            background-color: #007BFF;\n            border: none;\n            color: white;\n            border-radius: 5px;\n            cursor: pointer;\n        }\n    </style>\n</head>\n<body>\n    <h1>猛暑対策相談サービス</h1>\n    <p>電気代の高騰や熱中症リスクについて、相談に乗ります。</p>\n    <button id="consultation-button">相談を受ける</button>\n    <p id="response-message"></p>\n    <script>\n        document.getElementById("consultation-button").addEventListener("click", function() {\n            document.getElementById("response-message").innerText = "相談を受け付けました。こちらからご連絡いたします。";\n        });\n    </script>\n    <footer>#KGNINJA</footer>\n</body>\n</html>
