<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歯に関する悩み解決アプリ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f8ff; color: #333; }
        header { background-color: #007BFF; color: white; padding: 10px; text-align: center; }
        footer { text-align: center; margin-top: 20px; }
        .content { padding: 20px; }
        .suggestion { background-color: #e7f3ff; border-left: 6px solid #007BFF; padding: 10px; margin: 20px 0; }
    </style>
</head>
<body>
    <header>
        <h1>歯に関する悩み解決アプリ</h1>
    </header>
    <div class="content">
        <h2>問題について</h2>
        <p>忙しくて歯医者に行けないことが悩みです。以下の対策があります。</p>
        <div class="suggestion">
            <h3>対策 1: 自宅でのケア</h3>
            <p>定期的に歯ブラシとフロスを使い、歯周病を予防しましょう。</p>
        </div>
        <div class="suggestion">
            <h3>対策 2: 日常の習慣</h3>
            <p>口の中を清潔に保つために、食後すぐに歯を磨きましょう。</p>
        </div>
        <div class="suggestion">
            <h3>対策 3: 計画的な受診</h3>
            <p>忙しい合間を見つけて、3ヶ月ごとに定期診察を受けるようにしましょう。</p>
        </div>
    </div>
    <footer>
        <p>#KGNINJA AutoApp</p>
    </footer>
</body>
</html>
