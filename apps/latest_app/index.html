<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIに相談する</title>
    <style>
        body {
            background-color: #e0f7fa;
            color: #007BFF;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }
        footer {
            margin-top: 20px;
            font-size: small;
        }
    </style>
</head>
<body>
    <h1>AIと一緒に考える</h1>
    <p>あなたの悩みや選択肢について考えましょう。</p>
    <input type="text" id="userInput" placeholder="あなたの悩みを入力してください">
    <button onclick="submitInput()">相談する</button>
    <p id="response"></p>
    <footer>#KGNINJA AutoApp</footer>
    <script>
        function submitInput() {
            const input = document.getElementById('userInput').value;
            const response = document.getElementById('response');
            response.innerHTML = 'AI: ' + input + ' との対話を進めるためのプロセスを開始しました。';
            document.getElementById('userInput').value = '';
        }
    </script>
</body>
</html>
