<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子ども発達相談</title>
    <style>
        body { background-color: #e7f0ff; color: #333; font-family: Arial, sans-serif; }
        header { text-align: center; padding: 20px; }
        footer { text-align: center; padding: 10px; font-size: 0.75em; color: #007BFF; }
        .container { width: 80%; margin: 0 auto; padding: 20px; border: 1px solid #007BFF; border-radius: 8px; }
        button { background-color: #007BFF; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <header>
        <h1>子ども発達相談サポート</h1>
    </header>
    <div class="container">
        <p>お子さんの成長について悩んでいませんか？</p>
        <p>こちらのボタンをクリックして、相談予約をしましょう。</p>
        <button onclick="showConsultationInfo()">相談を予約する</button>
        <div id="consultation-info" style="display:none; margin-top: 20px;">
            <h2>相談内容について</h2>
            <p>当相談窓口では、お子様の発達について専門家と話すことができます。</p>
            <p>ぜひご利用ください。</p>
        </div>
    </div>
    <footer>
        <p>#KGNINJA AutoApp</p>
    </footer>
    <script>
        function showConsultationInfo() {
            document.getElementById(consultation-info).style.display = block;
        }
    </script>
</body>
</html>
