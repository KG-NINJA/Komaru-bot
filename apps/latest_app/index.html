<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ニセ警察詐欺対策アプリ</title>
    <style>
        body {
            background-color: #e8f4fa;
            color: #333;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #007BFF;
        }
        footer {
            margin-top: 20px;
            font-size: 0.8em;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>ニセ警察詐欺の説明</h1>
    <p>自宅に「逮捕状」を届ける手法は、ニセ警察詐欺の一部です。これは、騙されやすい人々をターゲットにして、恐怖心を煽り、金銭を騙し取ることを目的としています。</p>
    <p>もしこのような手紙が届いた場合は、すぐに県警に相談してください。</p>
    <p>このアプリは、ニセ警察詐欺の防止策を提供するために開発されました。</p>
    <script>
        function showAlert() {
            alert(警告: この手紙はニセ警察からのものかもしれません。すぐに確認を！);
        }
    </script>
    <button onclick="showAlert()">警告を表示</button>
    <footer>#KGNINJA AutoApp</footer>
</body>
</html>
