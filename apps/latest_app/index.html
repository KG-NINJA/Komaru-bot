<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャリア相談アプリ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4ff;
            color: #003366;
            text-align: center;
        }
        .container {
            margin: 20px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
        }
        button {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>キャリア相談</h1>
        <p>女性のキャリア相談を開始できます。下のボタンをクリックしてください。</p>
        <button id="startButton">相談を始める</button>
        <p id="response" style="margin-top: 20px;"></p>
    </div>
    <footer>
        <p>#KGNINJA AutoApp</p>
    </footer>
    <script>
        document.getElementById(startButton).onclick = function() {
            const responseArea = document.getElementById(response);
            responseArea.textContent = ご相談内容がございましたら、どのようなことでもお気軽にお知らせください。;
        };
    </script>
</body>
</html>
