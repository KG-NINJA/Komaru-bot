<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悩み相談アプリ</title>
    <style>
        body {
            background-color: #007BFF;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        textarea {
            width: 80%;
            height: 100px;
            margin-top: 20px;
        }
        #submit {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 20px;
        }
        #response {
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>悩み相談アプリ</h1>
    <p>あなたの悩みをお聞かせください:</p>
    <textarea id="input"></textarea>
    <br>
    <button id="submit">送信</button>
    <div id="response"></div>
    <footer>#KGNINJA AutoApp</footer>
    <script>
        document.getElementById(submit).addEventListener(click, function() {
            const input = document.getElementById(input).value;
            let responseMessage = ;
            if (input) {
                responseMessage = あなたの悩みは大切です。少しでも助けになれたら幸いです。;
            } else {
                responseMessage = 何かお聞かせください。;
            }
            document.getElementById(response).innerText = responseMessage;
        });
    </script>
</body>
</html>
