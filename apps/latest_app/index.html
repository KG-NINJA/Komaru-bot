<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相談窓口</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f8ff; color: #333; }
        header { background-color: #007BFF; color: white; padding: 10px; text-align: center; }
        footer { text-align: center; margin-top: 20px; } 
    </style>
</head>
<body>
    <header>
        <h1>安全相談窓口</h1>
    </header>
    <main>
        <h2>お困りのことがあれば相談してください</h2>
        <textarea id="issueInput" placeholder="ここに悩みを書いてください" rows="5" cols="50"></textarea>
        <button id="submitBtn">相談する</button>
        <p id="responseMessage"></p>
    </main>
    <footer>
        <p>#KGNINJA</p>
        <p>#KGNINJA AutoApp</p>
    </footer>
    <script>
        document.getElementById(submitBtn).addEventListener(click, function() {
            const issue = document.getElementById(issueInput).value;
            const response = あなたの悩みは:  + issue +  です。専門家に相談します。;
            document.getElementById(responseMessage).innerText = response;
        });
    </script>
</body>
</html>
