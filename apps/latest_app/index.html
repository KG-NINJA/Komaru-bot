<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肌悩み解決アプリ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e0f7fa; color: #000; padding: 20px; }
        h1 { color: #007BFF; }
        footer { font-size: 0.8em; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>あなたの肌の悩み、解決します！</h1>
    <p>
        このアプリでは、あなたの肌の気になる点をサポートするための製品をご紹介します。<br>
        ぜひ、使用してみてください。
    </p>
    <button id="solutionButton">製品を表示</button>
    <div id="solution" style="display:none; padding: 15px; border: 1px solid #007BFF; background-color: #f1f1f1;">
        <h2>おすすめ製品：</h2>
        <p>ジョンマスターオーガニックのマルチユース化粧液！肌悩みを多角的にケアします。</p>
    </div>
    <script>
        document.getElementById(solutionButton).onclick = function() {
            var solutionDiv = document.getElementById(solution);
            if (solutionDiv.style.display === none) {
                solutionDiv.style.display = block;
            } else {
                solutionDiv.style.display = none;
            }
        };
    </script>
    <footer>#KGNINJA AutoApp</footer>
</body>
</html>
