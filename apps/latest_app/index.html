<!DOCTYPE html>
<html lang="ja">
<head>

            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            border: 1px solid #007BFF;
            border-radius: 5px;
        }
        button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        footer {
            position: absolute;
            bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>あなたの悩みを聞かせてください</h1>
    <input type="text" id="worryInput" placeholder="悩みを書く..." />

    <div id="response"></div>
    <footer>

    <script>
        function submitWorry() {
            const input = document.getElementById(worryInput).value;
            const responseDiv = document.getElementById(response);
            responseDiv.innerHTML = `あなたの悩み: ${input}<br>AIからのアドバイス: ` + generateAdvice(input);
        }

            return 自分の気持ちを大切にして、友達や家族に相談してみて！;
        }
    </script>
</body>
</html>
