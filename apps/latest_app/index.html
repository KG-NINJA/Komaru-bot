<!DOCTYPE html>\n<html lang='ja'>\n<head>\n    <meta charset='UTF-8'>\n    <meta name='viewport' content='width=device-width, initial-scale=1.0'>\n    <title>困りごと解決アプリ</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            background-color: #f0f8ff; // calm blue color\n            color: #007BFF; \n            margin: 0;\n            padding: 20px;\n        }\n        footer {\n            margin-top: 20px;\n            font-size: 0.8em;\n            color: #555;\n        }\n    </style>\n</head>\n<body>\n    <h1>最近の困りごと</h1>\n    <p>ここでは、最近の相談の中から「親なきあとの相談窓口」に対する情報を提供します。親が亡くなったあと、自身や子ども、兄弟姉妹がどうすれば良いかを不安に感じる方に向けて、専門家が無料で相談に乗る窓口が開設されました。</p>\n    <p>連絡先や具体的な相談内容について詳しくは、地域の自治体のウェブサイトをチェックしてください。</p>\n    <footer>\n        <p>#KGNINJA AutoApp</p>\n    </footer>\n</body>\n</html>
