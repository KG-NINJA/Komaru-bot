<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハラスメント相談アプリ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            color: #007BFF;
            padding: 20px;
        }
        footer {
            margin-top: 20px;
            font-size: 0.8em;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>ハラスメントの悩みに対する相談</h1>
    <p>あなたの悩みをお聞きします。話すことで少しでも心が楽になるかもしれません。</p>
    <textarea id="adviceInput" rows="4" style="width: 100%;"></textarea>
    <button id="submit">相談する</button>
    <p id="response" style="margin-top: 20px; color: #007BFF;"></p>
    <footer>#KGNINJA</footer>
    <script>
        document.getElementById('submit').onclick = function() {
            const input = document.getElementById('adviceInput').value;
            document.getElementById('response').innerText = input ? 
                "あなたの悩みに寄り添います。大切なことを話してくれてありがとう。" : 
                "何かを入力してください。";
        };
    </script>
</body>
</html>
