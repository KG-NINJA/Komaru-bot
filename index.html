<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相談アプリ</title>
    <style>
        body {
            background-color: #e0f7fa;
            color: #004d40;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>悩みを聞かせてください</h1>
    <p>あなたの気持ちや悩みを自由に話してください。どんなことでも大丈夫です。</p>
    <textarea id="userInput" rows="10" cols="30" placeholder="ここにあなたの相談を書いてください..."></textarea>
    <br>
    <button onclick="saveInput()">相談を送信</button>
    <p id="response" style="margin-top: 20px;"></p>
    <footer style="margin-top: 30px;">#KGNINJA AutoApp</footer>
    <script>
        function saveInput() {
            const input = document.getElementById(userInput).value;
            if (input) {
                document.getElementById(response).innerText = あなたの相談が送信されました！;
            } else {
                document.getElementById(response).innerText = 何か相談を書いてください。;
            }
        }
    </script>
</body>
</html>
