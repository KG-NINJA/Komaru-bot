<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美容医療相談アプリ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e0f7fa; color: #007BFF; }
        h1 { color: #007BFF; }
        footer { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>美容医療に関するご相談</h1>
    <p>ご質問や疑問がある場合は、以下のフォームに入力してください。</p>
    <form id="queryForm">
        <label for="query">ご質問:</label><br>
        <textarea id="query" rows="4" cols="50" required></textarea><br>
        <button type="submit">相談する</button>
    </form>
    <div id="response" style="margin-top: 20px;"></div>
    <footer>
        <p>#KGNINJA AutoApp</p>
    </footer>
    <script>
        document.getElementById(queryForm).addEventListener(submit, function(event) {
            event.preventDefault();
            let query = document.getElementById(query).value;
            document.getElementById(response).innerHTML = `<p>あなたの質問: ${query}</p><p>医療の専門家が確認し、適切な答えをお返しします。</p>`;
            document.getElementById(query).value = ;
        });
    </script>
</body>
</html>
