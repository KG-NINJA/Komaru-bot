<!DOCTYPE html>\n<html lang='ja'>\n<head>\n    <meta charset='UTF-8'>\n    <meta name='viewport' content='width=device-width, initial-scale=1.0'>\n    <title>カスハラ相談窓口アプリ</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            background-color: #f0f8ff;\n            color: #333;\n            margin: 0;\n            padding: 20px;\n        }\n        h1 {\n            color: #007BFF;\n        }\n        footer {\n            position: absolute;\n            bottom: 10px;\n            left: 20px;\n            font-size: 12px;\n        }\n    </style>\n</head>\n<body>\n    <h1>カスハラ相談窓口</h1>\n    <p>あなたが感じるカスハラの悩みを聞きます。\n       企業内での問題を解決する手助けをします。</p>\n    <label for='issue'>お悩み: </label>\n    <textarea id='issue' rows='4' cols='50'></textarea><br>\n    <button onclick='submitIssue()'>送信</button>\n    <p id='response'></p>\n    <footer>#KGNINJA AutoApp</footer>\n    <script>\n        function submitIssue() {\n            const issue = document.getElementById('issue').value;\n            const response = document.getElementById('response');\n            response.innerText = 'お悩みを受け付けました: ' + issue;\n            document.getElementById('issue').value = '';\n        }\n    </script>\n</body>\n</html>
